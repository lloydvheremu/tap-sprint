<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tap That</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: one-screen instrument. Wordmark, a ruler-style round picker, a drum-head tap pad that takes all spare height, and a dock with your best and the leaderboard. System fonts only. */
:root {
  --bg: #E8ECF5;
  --surface: #F6F8FD;
  --ink: #0F1530;
  --muted: #59627F;
  --line: #C5CCE0;
  --accent: #2A3DF0;
  --accent-text: #2A3DF0;
  --signal: #FF5A2B;
  --on-signal: #0F1530;
  --on-accent: #FFFFFF;
  --on-accent-dim: rgba(255, 255, 255, 0.2);
  --ring: rgba(255, 255, 255, 0.13);
  --bad: #B3261E;
  --f-display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F22;
    --surface: #121932;
    --ink: #E9EDFB;
    --muted: #9AA3C6;
    --line: #252E52;
    --accent: #4A5BFF;
    --accent-text: #A3AEFF;
    --signal: #FF7A52;
    --bad: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F22;
  --surface: #121932;
  --ink: #E9EDFB;
  --muted: #9AA3C6;
  --line: #252E52;
  --accent: #4A5BFF;
  --accent-text: #A3AEFF;
  --signal: #FF7A52;
  --bad: #FF8A80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: var(--vvh, 100%); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 12px;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.app {
  height: 100%;
  width: 100%;
  max-width: 720px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.top, .modes, .custom, .dock { flex: none; }
.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.brand {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 24px;
  line-height: 1;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.cap {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.modes {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
}
.mode {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  min-width: 0;
  min-height: 58px;
  padding: 6px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
}
.mode + .mode { border-left: 1px solid var(--line); }
.mode .n { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; }
.mode .n.long { font-size: 20px; }
.mode .u {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mode[aria-pressed="true"] .u { color: inherit; opacity: 0.75; }
.mode:disabled { cursor: not-allowed; }
.mode:disabled:not([aria-pressed="true"]) { opacity: 0.4; }

.custom { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.custom label {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.custom input, .nameform input {
  min-width: 0;
  font-family: var(--f-body);
  font-weight: 600;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
}
.custom input { width: 96px; font-variant-numeric: tabular-nums; }
.custom input[aria-invalid="true"] { border-color: var(--bad); }
.customhint { font-size: 12px; color: var(--muted); }
.customhint.bad { color: var(--bad); }

.stage { flex: 1 1 auto; min-height: 220px; position: relative; }
.pad, .result, .board { position: absolute; inset: 0; border-radius: 14px; }

.pad {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
/* The pad is the fixed hit target. Everything you see lives in .padvis, so effects can move it without moving the target. */
.padvis {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 18px 28px;
  overflow: hidden;
  background-color: var(--accent);
  background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0 54px, var(--ring) 54px 56px);
  color: var(--on-accent);
}
.pad-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.tag {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.9;
}
.clock { display: flex; align-items: baseline; gap: 6px; }
.time {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(40px, 12vw, 64px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.sec {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.9;
}
.mid {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.count {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(96px, min(40vw, 30vh), 260px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.unit {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.9;
}
.pad-bottom { text-align: center; min-height: 3.4em; pointer-events: none; }
.hint {
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hint2 { margin-top: 4px; font-size: 12px; opacity: 0.9; text-wrap: balance; }
.pad.live .pad-bottom { visibility: hidden; }
.pad.done .hint { font-size: 22px; letter-spacing: 0.16em; }

.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--on-accent-dim); pointer-events: none; }
.bar i { display: block; height: 100%; background: var(--signal); transform-origin: left center; transform: scaleX(1); }

.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border: 2px solid var(--on-accent);
  border-radius: 50%;
  opacity: 0.7;
  pointer-events: none;
  animation: rip 0.5s ease-out forwards;
}
@keyframes rip { to { transform: scale(7); opacity: 0; } }

.result, .board {
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.result { padding: 20px; gap: 12px; animation: rise 0.26s ease-out both; }
.result:focus, .board h2:focus { outline: none; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
.result .cps { animation: pop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.05s both; transform-origin: left bottom; }
/* Confetti: one canvas behind the controls, above the card background. */
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 14px; pointer-events: none; z-index: 0; }
.result > :not(.confetti) { position: relative; z-index: 1; }
.badge.emph { outline: 3px solid var(--ink); outline-offset: 2px; }
/* Gentle call-to-action pulse: opacity only, about 0.9 per second, never below 70 percent. */
@keyframes nudge { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.pad.idle .hint, .again.blink .lbl { animation: nudge 1.1s ease-in-out infinite; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.res-head { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.rank {
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.badge {
  background: var(--signal);
  color: var(--on-signal);
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 4px;
}
.res-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cps {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(72px, 24vw, 132px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.cps-unit { font-family: var(--f-mono); font-weight: 700; font-size: 18px; letter-spacing: 0.14em; color: var(--muted); }
.summary { margin: 0; font-size: 18px; font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.poststatus { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0 10px; min-height: 44px; font-size: 15px; font-weight: 600; color: var(--ink); animation: rise 0.22s ease-out both; }
.poststatus.bad { color: var(--bad); }
.poststatus .linkbtn { margin: -10px 0; }
.ask {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px 8px;
  border: 2px solid var(--accent);
  border-radius: 10px;
  background: var(--bg);
  animation: rise 0.22s ease-out both;
}
.ask.locked { pointer-events: none; }
.ask label { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
.askrow { display: flex; flex-wrap: wrap; gap: 8px; }
.askrow input {
  flex: 2 1 150px;
  min-width: 0;
  min-height: 48px;
  font-family: var(--f-body);
  font-weight: 600;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
}
.askrow input[aria-invalid="true"] { border-color: var(--bad); }
.askrow .btn { flex: 1 1 140px; min-height: 48px; padding: 8px 14px; font-size: 15px; white-space: nowrap; }
.askmsg { margin: 0; min-height: 1.2em; font-size: 13px; color: var(--muted); }
.askmsg.bad { color: var(--bad); }
.linkbtn {
  appearance: none;
  border: 0;
  background: none;
  color: var(--accent-text);
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 13px;
  text-decoration: underline;
  min-height: 44px;
  padding: 4px 6px;
  cursor: pointer;
}
.chart { margin-top: auto; }
.result .again { flex: none; margin-top: 4px; }
.chartcap {
  margin: 0 0 6px;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.hist {
  display: grid;
  grid-template-columns: repeat(var(--n, 10), 1fr);
  gap: 4px;
  height: 92px;
  align-items: end;
  border-bottom: 1px solid var(--line);
}
.col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; min-width: 0; }
.col b { font-family: var(--f-mono); font-weight: 600; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col i { display: block; width: 100%; height: calc(2px + var(--p, 0) * 58px); background: var(--accent); border-radius: 2px 2px 0 0; }
.col.peak i { background: var(--signal); }
.axis { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--f-mono); font-weight: 600; font-size: 11px; color: var(--muted); }

.btn {
  appearance: none;
  border: 0;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 56px;
  padding: 14px 16px;
  border-radius: 8px;
  cursor: pointer;
}
.btn.small { min-height: 44px; padding: 8px 16px; font-size: 14px; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary {
  width: 100%;
  min-height: 64px;
  font-size: 22px;
  letter-spacing: 0.1em;
  background: var(--accent);
  color: var(--on-accent);
}
.btn.primary:focus-visible { outline-color: var(--ink); }
/* Short lock after a round so stray taps cannot hit a button: the button is dimmed and fills left to right. */
.btn { position: relative; overflow: hidden; }
.btn.locking:disabled { opacity: 0.6; cursor: wait; }
.btn.locking::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.34);
  transform-origin: left center;
  animation: lockfill var(--lock, 800ms) linear forwards;
}
@keyframes lockfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.dock { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.bestline {
  min-width: 0;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.ghost {
  flex: none;
  appearance: none;
  border: 1px solid var(--ink);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}
.ghost:disabled { opacity: 0.35; cursor: not-allowed; }

.board { padding: 14px; gap: 10px; overflow: hidden; animation: rise 0.24s ease-out both; }
.boardscroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 6px; }
.boardfoot { flex: none; }
.rankbanner {
  margin: 0;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  font-size: 15px;
  animation: rise 0.22s ease-out both;
}
.board h2:focus-visible { outline: 3px solid var(--signal); }
.board-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.board h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 14px;
  min-height: 44px;
  padding: 8px 0;
  cursor: pointer;
}
.tab + .tab { border-left: 1px solid var(--line); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.mtabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.mtab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  min-height: 44px;
  padding: 6px 0;
  cursor: pointer;
}
.mtab + .mtab { border-left: 1px solid var(--line); }
.mtab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.boardmsg { margin: 4px 0; color: var(--muted); font-size: 14px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto auto;
  column-gap: 10px;
  row-gap: 2px;
  align-items: baseline;
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
}
.rows button.nm {
  appearance: none;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-weight: 600;
  text-align: left;
  padding: 12px 0;
  margin: -12px 0;
  min-height: 44px;
  cursor: pointer;
}
.rows .sub { grid-column: 2 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.rows .sub[hidden] { display: none; }
.mt, .methodtag {
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 6px;
}
.methodtag { font-size: 12px; padding: 3px 8px; margin-left: 4px; vertical-align: 2px; white-space: nowrap; }
.rep {
  appearance: none;
  border: 0;
  background: none;
  color: var(--accent-text);
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 12px;
  text-decoration: underline;
  min-height: 44px;
  padding: 2px 6px;
  cursor: pointer;
}
.rep:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.rows .rk { font-family: var(--f-mono); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rows .sc { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.rows .tp { min-width: 64px; text-align: right; font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows li.mine { background: var(--bg); box-shadow: inset 4px 0 0 var(--signal); }
.rows li.mine.flash { animation: flash 2s ease-out 1; }
@keyframes flash { 0%, 35% { background: rgba(255, 90, 43, 0.38); } 100% { background: var(--bg); } }
.rows li.mine .nm { color: var(--accent-text); }
.meline { margin: 0; font-size: 13px; color: var(--muted); }
.meline.bad { color: var(--bad); }
.nameform { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: none; padding-top: 8px; }
.nameform label {
  width: 100%;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.nameform input { flex: 1 1 140px; }
.namemsg { width: 100%; min-height: 1.2em; font-size: 12px; color: var(--muted); }
.namemsg.bad { color: var(--bad); }

/* While the name field has focus (phone keyboard open) the card gets the whole screen. */
.app.typing .top, .app.typing .modes, .app.typing .custom, .app.typing .dock { display: none; }
.app.typing .result .chart, .app.typing .result .note, .app.typing .result .res-head { display: none; }
.app.typing .result .again { margin-top: auto; }
.app.typing .result { padding: 10px 12px; gap: 6px; }
.app.typing .result .cps { font-size: 48px; }
.app.typing .result .summary { display: none; }
.app.typing .result .ask { padding: 8px; gap: 4px; }
.app.typing .ask label { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app.typing .askmsg:empty { display: none; }
.app.typing .result .btn.primary { min-height: 48px; font-size: 18px; }

/* Name prompt up: the chart is the first thing to go on screens that are not tall. */
@media (max-height: 860px) {
  .cps { font-size: clamp(56px, min(24vw, 15vh), 120px); }
  .result.asking .chart, .result.asking .note { display: none; }

/* Very short screens (landscape phones): drop the header and give the pad the room. */
@media (max-height: 560px) {

@media (max-height: 560px) and (min-aspect-ratio: 1/1) and (min-width: 600px) {
  .result { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto 1fr auto; column-gap: 20px; row-gap: 4px; align-content: start; }

  .board-head { grid-area: 1 / 1; }

@media (max-height: 420px) and (min-aspect-ratio: 1/1) and (min-width: 600px) {

.padscan { position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.8s ease-out; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px); }
.fx-glitch .brand, .fx-glitch .cap, .fx-glitch .bestline {

}
.pad[data-skin="ember"] .padvis { background-color: #B3361A; }

.fxbtn { appearance: none; -webkit-appearance: none; width: 128px; padding: 8px 8px; font-family: var(--f-display); font-size: 12px; letter-spacing: 0.04em; text-align: center; text-align-last: center; text-overflow: ellipsis; cursor: pointer; }

<body>

<div id="fxback" class="fxback" aria-hidden="true"><div id="fxtint" class="fxtint"></div><canvas id="fxbackc" width="1" height="1" hidden></canvas></div>
<main id="app" class="app">
  <header class="top">

  </header>

  <div class="modes" role="group" aria-label="Round length">

    <button class="mode" type="button" data-mode="10" aria-pressed="false" aria-label="10 second round"><span class="n">10</span><span class="u">sec</span></button>

        <button class="mtab" role="tab" type="button" data-method="mouse" aria-selected="false" aria-label="Mouse">Mouse</button>
        <button class="mtab" role="tab" type="button" data-method="key" aria-selected="false" aria-label="Keyboard">Keys</button>
        <button class="mtab" role="tab" type="button" data-method="combo" aria-selected="false" aria-label="Mixed, mouse and keyboard together">Mixed</button>

      <div id="boardScroll" class="boardscroll">

      <div id="boardFoot" class="boardfoot" hidden>

  </footer>

<script>
/* Game owner: set leaderboardUrl to your leaderboard server (see README) to turn the global leaderboard on.
   Optional: getPlayerName is a function that returns the player's name from the portal the game runs on
   (a string or a Promise of one). When it gives a name, players are not asked to type one.
   CrazyGames names are picked up automatically when their SDK is on the page. */
window.TAP_SPRINT_CONFIG = { leaderboardUrl: '' };
</script>
<script>
(function () {
  'use strict';

  var KEY = 'tapsprint.v1';
  var PRESETS = [1, 5, 10, 30, 60];
  var MAX_CUSTOM = 600;
  var TIERS = [[11, 'Unreal'], [9, 'Blazing'], [7, 'Fast'], [5, 'Quick'], [3, 'Steady'], [0, 'Warming up']];
  var METHODS = ['touch', 'mouse', 'key', 'combo'];
  var METHOD_LABEL = { touch: 'Touch', mouse: 'Mouse', key: 'Keyboard', combo: 'Mixed' };
  var FLASH_MS = 500;
  var LOCK_MS = 800;
  var BOARD_LOCK_MS = 600;
  var CFG = window.TAP_SPRINT_CONFIG || {};

  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  var pad = $('pad'), padvis = $('padvis'), countEl = $('count'), timeEl = $('time'), tagEl = $('tag');
  var hintEl = $('hint'), hint2El = $('hint2'), fillEl = $('fill');
  var resultEl = $('result'), rankEl = $('rank'), badgeEl = $('badge'), cpsEl = $('cps');
  var sumEl = $('sumtext'), noteEl = $('note'), histEl = $('hist'), capEl = $('chartcap');
  var axisEnd = $('axisend'), againBtn = $('again');
  var postStatus = $('postStatus'), postText = $('postText'), postAct = $('postAct');
  var askForm = $('askForm'), askInput = $('askInput'), askBtn = $('askBtn'), askMsg = $('askMsg'), askLabel = $('askLabel');
  var appEl = $('app'), announceEl = $('announce'), rankBanner = $('rankBanner');
  var boardFoot = $('boardFoot'), boardPlay = $('boardPlay'), boardTitle = $('boardTitle');
  var whoText = $('whoText'), changeName = $('changeName');
  var customRow = $('customRow'), customInput = $('customSec'), customHint = $('customHint'), customN = $('customN');
  var bestLine = $('bestLine'), boardBtn = $('boardBtn'), fxBtnEl = $('fxBtn'), unlockNote = $('unlockNote');
  var boardEl = $('board'), boardBack = $('boardBack'), boardMsg = $('boardMsg'), boardRetry = $('boardRetry');
  var rowsEl = $('rows'), meLine = $('meLine'), nameForm = $('nameForm'), nameInput = $('nameInput'), nameMsg = $('nameMsg');
  var methodTag = $('methodTag'), repMsg = $('repMsg'), whoLine = $('whoLine');
  var modeBtns = [].slice.call(document.querySelectorAll('.mode'));
  var tabBtns = [].slice.call(document.querySelectorAll('.tab'));
  var mtabBtns = [].slice.call(document.querySelectorAll('.mtab'));

  var store = { mode: 5, custom: false, customSec: 45, best: {}, posted: {}, name: '', pid: '', method: '', fx: null, unlock: { v: 1, taps: 0, bests: 0, seen: [] } };
  var state = 'idle';            // idle | running | done | result
  var boardOpen = false, boardSec = 5, boardMethod = 'all', boardReq = 0, resultSeq = 0, boardLB = null;
  var srcs = { touch: false, mouse: false, key: false };
  var platformName = '', platformReady = Promise.resolve();
  var duration = 5000, nb = 5, bucketMs = 1000;
  var startT = 0, endT = 0, taps = 0, buckets = [];
  var raf = 0, tEnd = 0, tShow = 0, tLock = 0;
  var last = { taps: 0, prev: 0, isBest: false, sec: 5, custom: false, method: 'mouse', buckets: [] };
  var ripples = [];
  var pending = null;            // the score the result screen is posting: { sec, method, taps, rid }
  var postActFn = null, lockUntil = 0, typingT = 0;
  var hlNext = false, bannerBase = '', editingName = false, boardPushed = false, skipPop = false;

  /* ---- YouTube Playables hooks: inert unless the Playables SDK is present ---- */
  function yt(fn) {
    try {
      var g = window.ytgame;
      if (g && g.IN_PLAYABLES_ENV) { fn(g); }
    } catch (e) {}
  }
  function settle(p) {
    if (p && typeof p.catch === 'function') { p.catch(function () {}); }
  }

  /* ---- Helpers ---- */
  function fmt(ms) { return (ms / 1000).toFixed(2); }
  function fmtDur(s) {
    if (s < 60) { return s + ' sec'; }
    var m = Math.floor(s / 60), r = s % 60;
    return r ? m + ' min ' + r + ' sec' : m + ' min';
  }
  function curSec() { return store.custom ? store.customSec : store.mode; }
  function bestKey(sec, custom, method) { return (custom ? 'c' : '') + sec + ':' + method; }

  /* Input method. A round is classed by what the counted taps came from: touch (phones, tablets, pen),
     mouse, keyboard, or a mix of two or more of those. */
  function guessMethod() {
    try { if (window.matchMedia('(pointer: coarse)').matches) { return 'touch'; } } catch (e) {}
    return 'mouse';
  }
  function activeMethod() { return METHODS.indexOf(store.method) > -1 ? store.method : guessMethod(); }
  function methodOf(s) {
    var n = (s.touch ? 1 : 0) + (s.mouse ? 1 : 0) + (s.key ? 1 : 0);
    if (n > 1) { return 'combo'; }
    return s.touch ? 'touch' : (s.key ? 'key' : 'mouse');
  }
  function rankFor(cps) {
    for (var i = 0; i < TIERS.length; i++) {
      if (cps >= TIERS[i][0]) { return TIERS[i][1]; }
    }
    return TIERS[TIERS.length - 1][1];
  }
  function cleanName(s) {
    if (typeof s !== 'string') { return ''; }
    var n = s.replace(/\s+/g, ' ').trim();
    return /^[A-Za-z0-9 _.\-]{2,16}$/.test(n) ? n : '';
  }
  function platformClean(n) {
    if (typeof n !== 'string') { return ''; }
    var t = n.replace(/[^A-Za-z0-9 _.\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16).trim();
    return t.length >= 2 ? t : '';
  }
  function playerName() { return platformName || store.name; }
  function detectPlatformName() {
    var lookup = Promise.resolve().then(function () {
      if (typeof CFG.getPlayerName === 'function') { return CFG.getPlayerName(); }
      var cg = window.CrazyGames && window.CrazyGames.SDK;
      if (cg && cg.user && cg.user.isUserAccountAvailable) {
        return cg.user.getUser().then(function (u) { return u && u.username; });
      }
      return '';
    }).then(platformClean, function () { return ''; });
    var timeout = new Promise(function (res) { setTimeout(function () { res(''); }, 3000); });
    return Promise.race([lookup, timeout]).then(function (n) { platformName = n; });
  }
  function newPid() {
    var s = '';
    try {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      for (var i = 0; i < a.length; i++) { s += ('0' + a[i].toString(16)).slice(-2); }
    } catch (e) { s = ''; }
    if (s.length < 24) {
      s = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^a-z0-9]/g, '');
    }
    return s.slice(0, 40);
  }

  /* ---- Saved state ---- */
  /* Keys look like 5:mouse or c45:touch. Older saves had no method (5, c45): those bests are kept under the
     method this device most likely used. Older "posted" marks are dropped so those bests post again. */
  function mergeMap(dst, src, keepLegacy) {
    if (!src || typeof src !== 'object') { return; }
    Object.keys(src).forEach(function (k) {
      var key = k;
      if (/^c?\d{1,3}$/.test(k)) {
        if (!keepLegacy) { return; }

      }
      var v = Math.floor(Number(src[k]));

  }
  function merge(o) {
    if (!o || typeof o !== 'object') { return; }
    var m = Number(o.mode);
    if (PRESETS.indexOf(m) > -1) { store.mode = m; }
    if (typeof o.custom === 'boolean') { store.custom = o.custom; }
    var cs = Number(o.customSec);
    if (isFinite(cs) && Math.floor(cs) === cs && cs >= 1 && cs <= MAX_CUSTOM) { store.customSec = cs; }
    mergeMap(store.best, o.best, true);
    mergeMap(store.posted, o.posted, false);
    if (METHODS.indexOf(o.method) > -1 && !store.method) { store.method = o.method; }
    var n = cleanName(o.name);
    if (n && !store.name) { store.name = n; }
    if (typeof o.pid === 'string' && /^[a-z0-9]{12,64}$/.test(o.pid) && !store.pid) { store.pid = o.pid; }
    /* Effects settings and cosmetic unlock progress (both optional; older saves have neither). */
    if (!store.fx) { store.fx = FX.clean(o.fx); }
    FX.mergeUnlock(o.unlock);
  }
  function load() {
    try {

    } catch (e) {}
  }

    var s = JSON.stringify(store);

  /* ---- Leaderboard adapters ----
     Each adapter: top(sec, method) -> Promise<{rows:[{id?,name,taps,method,mine}], me, hidden}>
                   submit(sec, method, taps) -> Promise, setName(name) -> Promise, report(id) -> Promise (optional).
     Order of preference: your own server (leaderboardUrl), the Artifact shared store, none. */
  var NONE = { kind: 'none' };
  var lbPromise = null;

  function makeHttp(base) {
    base = base.replace(/\/+$/, '');
    function req(path, opts) {
      opts = opts || {};
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      if (ctl) { opts.signal = ctl.signal; }
      var timer = setTimeout(function () { if (ctl) { ctl.abort(); } }, 8000);
      return fetch(base + path, opts).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) {
          return r.json().then(function (j) { return j || {}; }, function () { return {}; }).then(function (j) {
            var e = new Error('http ' + r.status);
            e.status = r.status;
            e.code = j.error || '';

          });

    }

      return req(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }

      kind: 'http',
      perDocName: false,
      top: function (sec, method) {
        return req('/scores?sec=' + sec + '&method=' + encodeURIComponent(method) + '&pid=' + encodeURIComponent(store.pid), { cache: 'no-store' }).then(function (j) {
          return { rows: (j && j.rows) || [], me: (j && j.me) || null, hidden: !!(j && j.hidden) };
        });
      },
      submit: function (sec, method, taps) {
        return postJson('/scores', { sec: sec, method: method, taps: taps, name: playerName(), pid: store.pid });
      },
      setName: function (name) { return postJson('/name', { pid: store.pid, name: name }); },
      report: function (id) { return postJson('/report', { pid: store.pid, id: id }); }
    };
  }

  function makeDb(db) {
    function docId(sec, method) { return sec + '_' + method + '_' + store.pid; }
    return {
      kind: 'db',
      perDocName: true,
      top: function (sec, method) {
        var q = db.collection('scores').where('sec', '==', sec);
        if (method !== 'all') { q = q.where('method', '==', method); }
        return q.orderBy('taps', 'desc').limit(50).get().then(function (snap) {
          var list = snap.docs.map(function (d) {
            var v = d.data() || {};
            var m = METHODS.indexOf(v.method) > -1 ? v.method : 'mouse';
            return { name: String(v.name || 'Player'), taps: Number(v.taps) || 0, ts: Number(v.ts) || 0, method: m, mine: d.id === docId(sec, m) };
          });
          list.sort(function (a, b) { return (b.taps - a.taps) || (a.ts - b.ts); });
          return { rows: list.slice(0, 20), me: null, hidden: false };
        });
      },
      submit: function (sec, method, taps) {
        var ref = db.doc('scores/' + docId(sec, method));
        var name = playerName();
        return ref.get().then(function (s) {
          var cur = s.exists ? s.data() : null;
          if (cur && Number(cur.taps) >= taps) {
            return cur.name === name ? undefined : ref.update({ name: name });
          }
          return ref.set({ sec: sec, method: method, taps: taps, name: name, ts: Date.now() });
        });
      },
      setName: function () { return Promise.resolve(); }
    };
  }

  function getLB() {
    if (!lbPromise) {
      lbPromise = Promise.resolve().then(function () {
        if (typeof CFG.leaderboardUrl === 'string' && CFG.leaderboardUrl.trim()) {
          return makeHttp(CFG.leaderboardUrl.trim());
        }
        if (window.claude && typeof window.claude.use === 'function') {

    }
    return lbPromise;
  }

  /* The server refused the name (blocked word or bad format): forget a typed name so the player is asked again. */
  function nameErr(e) { return !!(e && (e.code === 'name not allowed' || e.code === 'invalid name')); }
  function nameRejected() {
    if (!platformName) {
      store.name = '';
      save();
      nameInput.value = '';
    }
    if (boardOpen) {

      nameMsg.textContent = platformName ? 'This name cannot be used on the leaderboard.' : 'That name is not allowed. Please choose another.';
    }
  }

  function postScore(sec, method, taps) {
    return platformReady.then(getLB).then(function (lb) {

    }, function (e) {

  }

  /* Post every stored preset best that has not been posted (or all of them, when force is set). */
  function syncBests(force) {
    return platformReady.then(function () {
      if (!playerName()) { return; }
      var chain = Promise.resolve();
      PRESETS.forEach(function (sec) {
        METHODS.forEach(function (m) {
          var k = bestKey(sec, false, m);
          var b = store.best[k];
          if (b && (force || b > (store.posted[k] || 0))) {
            chain = chain.then(function () {
              if (!playerName()) { return; }
              return postScore(sec, m, b).catch(function () {});
            });
          }
        });
      });
      return chain;
    });
  }

  /* ---- Rendering ---- */
  function setControlsEnabled(on) {
    modeBtns.forEach(function (b) { b.disabled = !on; });
    customInput.disabled = !on;
    boardBtn.disabled = !on;
    fxBtnEl.disabled = !on;
  }

  function renderBest() {
    var sec = curSec();
    var m = activeMethod();
    var b = store.best[bestKey(sec, store.custom, m)];
    var label = fmtDur(sec) + (store.custom ? ' custom' : '') + ' (' + METHOD_LABEL[m] + ')';
    bestLine.textContent = b
      ? 'Best for ' + label + ': ' + (b / sec).toFixed(1) + ' CPS, ' + b + (b === 1 ? ' tap' : ' taps')
      : 'No score yet for ' + label;
  }

  function configure() {
    var sec = curSec();

    modeBtns.forEach(function (b) {
      var v = b.getAttribute('data-mode');
      var on = (v === 'custom') ? store.custom : (!store.custom && Number(v) === store.mode);
      b.setAttribute('aria-pressed', String(on));
    });

    customN.className = 'n' + (customN.textContent.length >= 3 ? ' long' : '');
    customRow.hidden = !store.custom;
    if (document.activeElement !== customInput) { customInput.value = String(store.customSec); }
    tagEl.textContent = fmtDur(sec) + ' round';
    renderBest();
  }

  function resetToIdle() {
    clearTimeout(tEnd); clearTimeout(tShow); clearTimeout(tLock);
    cancelAnimationFrame(raf);
    resultSeq += 1;
    state = 'idle';
    boardOpen = false;
    dropBoardHistory();
    appEl.classList.remove('onboard');
    appEl.classList.remove('typing');
    askForm.hidden = true;
    postStatus.hidden = true;
    rankBanner.hidden = true;
    resultEl.classList.remove('asking');
    pending = null;
    hlNext = false;
    stopConfetti();
    againTapped = false;
    againBtn.classList.remove('blink');
    FX.reset();
    unlockNote.hidden = true;
    taps = 0;
    buckets = [];
    configure();
    countEl.textContent = '0';
    timeEl.textContent = fmt(duration);
    fillEl.style.transform = 'scaleX(1)';
    hintEl.textContent = 'Tap anywhere to start';
    hint2El.textContent = 'Click, right-click or press Space works too. Your first tap starts the clock.';
    pad.classList.remove('live');
    pad.classList.remove('done');
    pad.classList.add('idle');
    pad.setAttribute('aria-label', 'Tap area, ' + fmtDur(curSec()) + ' round. Tap to start.');
    resultEl.hidden = true;
    boardEl.hidden = true;
    pad.hidden = false;
    setControlsEnabled(true);
  }

  /* ---- Round flow ---- */
  function begin(now) {
    state = 'running';
    startT = now;
    endT = now + duration;
    taps = 0;
    buckets = [];
    srcs = { touch: false, mouse: false, key: false };
    for (var i = 0; i < nb; i++) { buckets.push(0); }
    setControlsEnabled(false);
    pad.classList.remove('idle');
    pad.classList.add('live');
    tEnd = setTimeout(finish, duration);
    raf = requestAnimationFrame(tick);
    FX.roundStart(curSec());
  }

  function tick() {
    if (state !== 'running') { return; }
    var left = endT - performance.now();
    if (left <= 0) { finish(); return; }
    timeEl.textContent = fmt(left);
    fillEl.style.transform = 'scaleX(' + (left / duration).toFixed(4) + ')';
    raf = requestAnimationFrame(tick);
  }

  function finish() {
    if (state !== 'running') { return; }
    state = 'done';
    clearTimeout(tEnd);
    cancelAnimationFrame(raf);
    timeEl.textContent = fmt(0);
    fillEl.style.transform = 'scaleX(0)';
    countEl.textContent = String(taps);
    hintEl.textContent = 'Time!';
    hint2El.textContent = '';
    pad.classList.remove('live');
    pad.classList.add('done');
    var sec = curSec(), custom = store.custom, method = methodOf(srcs), key = bestKey(sec, custom, method);
    var prev = store.best[key] || 0;
    last = { taps: taps, prev: prev, isBest: taps > prev, sec: sec, custom: custom, method: method, buckets: buckets.slice() };
    store.method = method;
    if (last.isBest) { store.best[key] = taps; }
    FX.roundEnd(last);
    save();
    tShow = setTimeout(showResult, FLASH_MS);
  }

  function drawHist(b, sec) {
    histEl.textContent = '';
    histEl.style.setProperty('--n', String(b.length));
    var max = Math.max.apply(null, b);
    b.forEach(function (v) {
      var col = document.createElement('div');
      col.className = 'col' + ((max > 0 && v === max) ? ' peak' : '');
      var n = document.createElement('b');
      n.textContent = String(v);
      var bar = document.createElement('i');
      bar.style.setProperty('--p', max > 0 ? String(v / max) : '0');
      col.appendChild(n);
      col.appendChild(bar);
      histEl.appendChild(col);
    });
    var bs = sec / b.length;
    var bsText = (bs % 1 === 0) ? String(bs) : String(Math.round(bs * 10) / 10);
    capEl.textContent = (bs === 1 ? 'Taps per second' : 'Taps per ' + bsText + ' sec') + ', fastest in orange';
    axisEnd.textContent = fmtDur(sec);
  }

  /* A button that cannot be hit for a moment after a round, with a fill that shows it is about to wake up. */
  function lockBtn(btn, ms) {
    clearTimeout(btn._lt);
    if (ms <= 0) { btn.disabled = false; btn.classList.remove('locking'); return; }
    btn.disabled = true;
    btn.classList.remove('locking');
    void btn.offsetWidth;
    btn.style.setProperty('--lock', ms + 'ms');
    btn.classList.add('locking');
    btn._lt = setTimeout(function () { btn.disabled = false; btn.classList.remove('locking'); }, ms);
  }
  function announce(text) {
    announceEl.textContent = '';
    setTimeout(function () { announceEl.textContent = text; }, 40);
  }
  function focusSoft(el) { try { el.focus({ preventScroll: true }); } catch (e) {} }

  /* ---- Confetti: about 3 seconds, one canvas, no libraries, nothing left behind afterwards ---- */
  var CONFETTI_MS = 3000, FADE_MS = 700;
  var confetti = null, badgeT = 0;
  function reduced() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  function stopConfetti() {
    clearTimeout(badgeT);
    badgeEl.classList.remove('emph');
    if (!confetti) { return; }
    cancelAnimationFrame(confetti.raf);
    clearTimeout(confetti.timer);
    if (confetti.canvas.parentNode) { confetti.canvas.parentNode.removeChild(confetti.canvas); }
    confetti = null;
  }
  function startConfetti() {
    stopConfetti();
    var W = resultEl.clientWidth, H = resultEl.clientHeight;
    if (!W || !H) { return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var canvas = document.createElement('canvas');
    canvas.id = 'confetti';
    canvas.className = 'confetti';
    canvas.setAttribute('aria-hidden', 'true');
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return; }
    ctx.scale(dpr, dpr);
    resultEl.insertBefore(canvas, resultEl.firstChild);
    var host = resultEl.getBoundingClientRect(), sc = cpsEl.getBoundingClientRect();
    var ox = sc.left + sc.width / 2 - host.left, oy = Math.max(8, sc.top - host.top + 6);
    var low = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 2);
    var n = low ? 60 : 120;
    var dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().toLowerCase() === '#0a0f22';
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2A3DF0';
    var signal = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim() || '#FF5A2B';
    var colors = [accent, signal, '#F5B700', '#E6379A', dark ? '#37D6B4' : '#0FA88A', dark ? '#9B7BFF' : '#7B4DFF'];
    var parts = [];
    var scale = Math.max(0.6, Math.min(1.4, Math.min(W, H * 1.4) / 420));
    for (var i = 0; i < n; i++) {
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.3;
      var sp = (200 + Math.random() * 420) * scale;
      parts.push({
        x: ox + (Math.random() - 0.5) * 40, y: oy,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14, sf: 2 + Math.random() * 3, sp: Math.random() * 6.28,
        c: colors[i % colors.length], round: i % 5 === 0

    var t0 = performance.now(), last = t0;
    confetti = { canvas: canvas, raf: 0, timer: 0 };
    confetti.timer = setTimeout(stopConfetti, CONFETTI_MS + 400);   // safety net if frames are throttled
    function frame(ts) {
      if (!confetti || confetti.canvas !== canvas) { return; }
      var t = ts - t0;
      if (t >= CONFETTI_MS) { stopConfetti(); return; }
      var dt = Math.min(0.034, Math.max(0, (ts - last) / 1000));
      last = ts;
      var u = t > CONFETTI_MS - FADE_MS ? (t - (CONFETTI_MS - FADE_MS)) / FADE_MS : 0;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = (1 - u) * (1 - u);
      for (var k = 0; k < parts.length; k++) {
        var p = parts[k];
        p.vy += 620 * dt;                 // gravity against air drag: a slow drift, not a drop
        p.vx *= 1 - 1.8 * dt;
        p.vy *= 1 - 3 * dt;
        p.x += (p.vx + Math.sin(t / 1000 * p.sf + p.sp) * 28) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 20) { continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h * 0.7, 0, 6.2832); ctx.fill(); } else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }

      confetti.raf = requestAnimationFrame(frame);
    }
    confetti.raf = requestAnimationFrame(frame);
  }
  /* Reduced motion: no confetti, just a brief static outline on the badge. */
  function celebrate() {
    if (reduced()) {
      badgeEl.classList.add('emph');
      badgeT = setTimeout(function () { badgeEl.classList.remove('emph'); }, CONFETTI_MS);
    } else {
      startConfetti();
    }
  }

  /* Play again label pulses only once it is live, and not while the name field has focus or after it was tapped. */
  var againTapped = false;
  function updateBlink() {
    var on = state === 'result' && !boardOpen && !againBtn.disabled && !againTapped && document.activeElement !== askInput;
    againBtn.classList.toggle('blink', on);
  }

  function setStatus(text, bad, actLabel, actFn) {
    postText.textContent = text;
    postStatus.className = 'poststatus' + (bad ? ' bad' : '');
    postAct.hidden = !actLabel;
    postAct.textContent = actLabel || '';
    postActFn = actFn || null;
    postStatus.hidden = false;
    announce(text);
  }
  postAct.addEventListener('click', function () { if (postActFn) { postActFn(); } });

  function setAsk(text, bad) {
    askMsg.textContent = text;
    askMsg.className = 'askmsg' + (bad ? ' bad' : '');

    if (text) { announce(text); }
  }
  var askWorking = false;
  function askBusy(on) {
    askWorking = on;
    askInput.readOnly = on;
    askBtn.disabled = on;
  }
  function askVisible() { return !askForm.hidden; }

  /* Inline name prompt on the result card. It stays locked until the post-round lock ends. */
  function showAsk(msg) {
    var left = Math.max(0, lockUntil - performance.now());
    askLabel.textContent = 'Add a name to post to the ' + METHOD_LABEL[last.method] + ' leaderboard';
    postStatus.hidden = true;
    askForm.hidden = false;
    resultEl.classList.add('asking');
    askBusy(false);
    setAsk(msg || '', !!msg);
    if (left > 0) {
      askForm.classList.add('locked');
      askInput.readOnly = true;
      lockBtn(askBtn, left);
    } else {
      askForm.classList.remove('locked');
      lockBtn(askBtn, 0);
      var ae = document.activeElement;
      if (!ae || ae === document.body || ae === resultEl || ae === againBtn) { focusSoft(askInput); }
    }
    updateBlink();
  }

  function settleFocus() {
    if (state !== 'result' || boardOpen) { return; }
    askForm.classList.remove('locked');
    if (askVisible()) {
      if (!askWorking) { askInput.readOnly = false; }
      focusSoft(askInput);
    } else {
      focusSoft(againBtn);
    }
    updateBlink();
  }

  function showPosted(job, rank) {
    askForm.hidden = true;
    resultEl.classList.remove('asking');
    appEl.classList.remove('typing');
    var m = METHOD_LABEL[job.method];
    var text = rank ? 'Posted. You’re #' + rank + ' on ' + m + ', ' + fmtDur(job.sec) + '.' : 'Posted to the ' + m + ' leaderboard.';
    setStatus(text, false, 'View leaderboard', function () {
      openBoard({ sec: job.sec, method: job.method, rank: rank, highlight: true });
    });
  }

  function autoPost(job) {
    setStatus('Posting your score…', false);
    postScore(job.sec, job.method, job.taps).then(function (res) {
      if (job.rid !== resultSeq) { return; }
      showPosted(job, res && res.rank ? res.rank : null);
    }, function (e) {
      if (job.rid !== resultSeq) { return; }
      if (nameErr(e)) {
        if (platformName) { setStatus('Your name cannot be used on the leaderboard.', true); } else { showAsk('That name is not allowed. Please choose another.'); }
        return;
      }
      setStatus('Could not post this score. It is saved on this device.', true, 'Try again', function () { autoPost(job); });
    });
  }

  function showResult() {
    state = 'result';
    var sec = last.sec;
    var label = fmtDur(sec) + (last.custom ? ' custom' : '') + ' (' + METHOD_LABEL[last.method] + ')';
    var cps = last.taps / sec;
    methodTag.textContent = METHOD_LABEL[last.method];
    rankEl.textContent = rankFor(cps);
    cpsEl.textContent = cps.toFixed(1);
    sumEl.textContent = last.taps + (last.taps === 1 ? ' tap' : ' taps') + ' in ' + fmtDur(sec);
    badgeEl.hidden = !last.isBest;
    if (last.isBest) {
      noteEl.textContent = last.prev
        ? 'Beat your previous best of ' + last.prev + (last.prev === 1 ? ' tap.' : ' taps.')
        : 'First score saved for ' + label + '.';
    } else {
      var b = store.best[bestKey(sec, last.custom, last.method)];
      noteEl.textContent = 'Your best for ' + label + ': ' + b + (b === 1 ? ' tap' : ' taps') + ' (' + (b / sec).toFixed(1) + ' CPS).';
    }
    drawHist(last.buckets, sec);
    renderBest();
    pad.hidden = true;
    FX.shown();
    var ut = FX.takeUnlock();
    unlockNote.textContent = ut;
    unlockNote.hidden = !ut;
    boardEl.hidden = true;
    postStatus.hidden = true;
    askForm.hidden = true;
    resultEl.classList.remove('asking');
    resultEl.hidden = false;
    setControlsEnabled(true);
    announce(rankFor(cps) + '. ' + last.taps + ' taps in ' + fmtDur(sec) + ', ' + cps.toFixed(1) + ' per second' + (last.isBest ? '. New best.' : '.'));

    /* Stray taps right after the round must not hit a button or type into the field. */
    lockUntil = performance.now() + LOCK_MS;
    lockBtn(againBtn, LOCK_MS);
    focusSoft(resultEl);
    clearTimeout(tLock);
    tLock = setTimeout(settleFocus, LOCK_MS);

    var rid = (resultSeq += 1);
    var job = { sec: last.sec, method: last.method, taps: last.taps, rid: rid };
    pending = job;
    stopConfetti();
    againTapped = false;
    againBtn.classList.remove('blink');
    /* A new best on a preset round (first score on a board included) gets the celebration, once per round. */
    if (last.isBest && !last.custom) {
      requestAnimationFrame(function () { if (rid === resultSeq && state === 'result' && !boardOpen) { celebrate(); } });
    }
    Promise.all([getLB(), platformReady]).then(function (arr) {
      var lb = arr[0];
      if (rid !== resultSeq || lb.kind === 'none') { return; }
      if (last.custom) { setStatus('Custom rounds are not ranked on the leaderboard.', false); return; }
      if (!last.isBest) { return; }
      if (!playerName()) { showAsk(''); return; }
      autoPost(job);
    });
  }

  askForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (askBtn.disabled || askInput.readOnly || !pending) { return; }
    var job = pending;
    var n = cleanName(askInput.value);
    if (!n) {
      setAsk('Use 2 to 16 letters, numbers, spaces, dots, dashes or underscores.', true);
      focusSoft(askInput);
      return;
    }
    askBusy(true);
    setAsk('Checking name…', false);
    platformReady.then(getLB).then(function (lb) {
      return lb.setName ? lb.setName(n).then(function () { return lb; }) : lb;
    }).then(function (lb) {
      store.name = n;
      save();
      setAsk('Posting your score…', false);
      return postScore(job.sec, job.method, job.taps).then(function (res) {
        syncBests(lb.perDocName);

    /* Decorative pieces (title, captions, footer line and some shapes) are cloned onto a layer behind the page; the originals

    var valid = raw !== '' && isFinite(v) && Math.floor(v) === v && v >= 1 && v <= MAX_CUSTOM;
    customInput.setAttribute('aria-invalid', valid ? 'false' : 'true');
    customHint.className = 'customhint' + (valid ? '' : ' bad');
    if (!valid) { return; }
    if (v === store.customSec && state === 'idle' && !boardOpen) { return; }
    store.customSec = v;
    save();
    resetToIdle();
  }
  customInput.addEventListener('input', applyCustom);
  customInput.addEventListener('blur', function () {
    customInput.value = String(store.customSec);
    customInput.setAttribute('aria-invalid', 'false');
    customHint.className = 'customhint';
  });
  customInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); customInput.blur(); }
  });

  againBtn.addEventListener('click', function () {
    if (againBtn.disabled) { return; }
    againTapped = true;
    updateBlink();
    playAgain();
  });

  /* Phone keyboard: when a text field has focus and the visible height has dropped a lot (a soft keyboard is up),
     size the app to what is visible and give the result card the whole screen. Desktop keeps the full layout. */
  var baseH = window.innerHeight, baseW = window.innerWidth;
  function syncViewport() {
    var vv = window.visualViewport, root = document.documentElement, ae = document.activeElement;
    var cur = vv ? Math.min(window.innerHeight, vv.height) : window.innerHeight;
    var typing = ae === askInput || ae === nameInput || ae === customInput;
    if (window.innerWidth !== baseW) { baseW = window.innerWidth; baseH = Math.max(window.innerHeight, cur); }
    if (!typing) { baseH = Math.max(window.innerHeight, cur); }
    var up = typing && baseH - cur > 120;
    appEl.classList.toggle('typing', up && ae === askInput);
    if (up) {
      root.style.setProperty('--vvh', Math.round(cur) + 'px');
      window.scrollTo(0, 0);
    } else {
      root.style.removeProperty('--vvh');
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }
  window.addEventListener('resize', syncViewport);
  [nameInput, customInput].forEach(function (el) {
    el.addEventListener('focus', syncViewport);
    el.addEventListener('blur', function () { setTimeout(syncViewport, 150); });
  });

  /* ---- Boot ---- */
  load();
  FX.applyLook();
  if (!store.pid) { store.pid = newPid(); save(); }
  platformReady = detectPlatformName();
  resetToIdle();

  requestAnimationFrame(function () {
    yt(function (g) {
      g.game.firstFrameReady();
      g.game.gameReady();
    });
  });
  yt(function (g) {
    settle(Promise.resolve(g.game.loadData()).then(function (s) {
      if (!s) { return; }
      merge(JSON.parse(s));
      FX.applyLook();
      if (state === 'idle' && !boardOpen) { resetToIdle(); } else { renderBest(); }
    }));
  });
})();
</script>
</body>
</html>
